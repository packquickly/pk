[package]
name = "pk"
version = "0.1.0"
edition = "2024"
description = "Extract matches from terminal output and act on the one you pick."

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
shlex = "2.0.1"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
